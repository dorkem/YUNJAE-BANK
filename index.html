<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUNJAE BANK</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e9e2;color:#29473d;font-family:system-ui;text-align:center}main{max-width:480px;margin:auto;padding:28px 16px}nav{margin:20px}button,a{cursor:pointer}nav a{display:inline-block;padding:10px 16px;background:#34594b;color:white;border-radius:8px;text-decoration:none;margin:3px}.machine{width:min(320px,100%);margin:auto;padding:28px 24px;background:linear-gradient(125deg,#fffdf2,#d4d7c9);border:2px solid #b8c1b1;border-radius:24px;box-shadow:8px 10px #aab5a6,12px 18px 25px #0002}.brand{font-weight:900;letter-spacing:3px;margin-bottom:20px}.screen{background:#202923;border:5px solid #a6afa1;border-radius:10px;padding:15px;color:#c5d2c5}.digits{font:bold 68px monospace;color:#ff6045;text-shadow:0 0 12px #ff604588}.slot{height:17px;background:#222;border:4px solid #aab1a3;border-radius:6px;margin-top:25px}.zone{height:230px;position:relative}.paper{position:absolute;top:-10px;left:50%;margin-left:-85px;width:170px;background:#fffef5;padding:18px 10px;box-shadow:2px 6px 10px #0002;touch-action:none;cursor:grab;user-select:none;border-bottom:5px dotted #c6c8bd}.paper b{display:block;font:bold 48px monospace;margin:10px}.paper hr{border:0;border-top:1px dashed #aaa}.next{width:130px;height:130px;border-radius:50%;border:8px solid #343b34;background:radial-gradient(circle at 35% 25%,#ff8b78,#c51e20);color:white;font:bold 24px system-ui;box-shadow:0 9px #722020;margin:25px}.next:active{transform:translateY(8px);box-shadow:0 1px #722020}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.keys button{height:46px;border:1px solid #aab5a6;border-radius:7px;background:#f5f6ee;font:bold 20px system-ui;box-shadow:0 3px #aab5a6}.keys button:active{transform:translateY(3px);box-shadow:none}#pin{font:32px monospace;letter-spacing:8px;background:#202923;color:#b8efb4;padding:15px;border-radius:8px}[hidden]{display:none!important}footer{font-size:11px;letter-spacing:2px;margin-top:25px}#msg{min-height:30px;font-weight:bold}#admin .machine{position:relative} .next{transition:transform 70ms,box-shadow 70ms;box-shadow:0 13px #722020,0 17px 12px #0004;touch-action:manipulation}.next:active{transform:translateY(12px);box-shadow:0 1px #722020}.next.slam{animation:slam .36s ease-out}#admin .machine.impact{animation:impact .38s ease-out}#admin .screen.flash{animation:flash .4s ease-out}@keyframes slam{0%{transform:translateY(-3px)}20%{transform:translateY(13px) scale(1.05,.91);box-shadow:0 0 #722020}45%{transform:translateY(-4px)}70%{transform:translateY(3px)}100%{transform:none}}@keyframes impact{0%,100%{transform:none}20%{transform:translateY(7px) rotate(-1deg)}35%{transform:translate(-4px,-3px) rotate(1deg)}50%{transform:translate(3px,2px)}75%{transform:translate(-1px,0)}}@keyframes flash{20%{box-shadow:0 0 22px #ff603b,inset 0 0 12px #ff603b}100%{box-shadow:none}}@media(prefers-reduced-motion:reduce){.next.slam,#admin .machine.impact,#admin .screen.flash{animation:none}}</style><main><h2>YUNJAE BANK</h2><nav><a href="./">번호표 발급</a><a href="#admin" id="adminLink">🔒 관리자 창구</a></nav><section id="user"><div class="machine"><div class="brand">YUNJAE BANK</div><div class="screen">현재 호출 번호<div class="digits" id="num">000</div></div><p>번호표를 아래로 당겨주세요</p><div class="slot"></div></div><div class="zone"><div class="paper" id="paper" tabindex="0" role="button" aria-label="번호표 발급">YUNJAE BANK<hr>대기 번호<b id="ticket">001</b><small id="date"></small><hr>▼ 아래로 당겨주세요</div></div></section><section id="login" hidden><div class="machine"><div class="brand">직원 전용 키패드</div><div id="pin">----</div><div class="keys" id="keys"></div><p id="error"></p></div></section><section id="admin" hidden><div class="machine"><div class="brand">YUNJAE BANK</div><div class="screen">현재 호출 번호<div class="digits" id="called">000</div></div><button class="next" id="next">NEXT</button><p id="waiting"></p></div><p><button id="reset">번호 초기화</button> <button id="lock">창구 잠그기</button></p></section><p id="msg" aria-live="polite"></p><footer>YUNJAE BANK · DAILY QUEUE SYSTEM</footer></main><script>
const $=id=>document.getElementById(id),K='yunjae-bank-v1',day=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}),fmt=n=>String(n).padStart(3,'0'),blank=()=>({date:day(),issued:0,current:0});let s=blank(),pin='',unlocked=false,busy=false,last=0,start=null,dist=0;
function read(){try{let x=JSON.parse(localStorage.getItem(K));return x&&x.date===day()&&Number.isSafeInteger(x.issued)&&Number.isSafeInteger(x.current)&&x.issued>=x.current&&x.current>=0?x:blank()}catch{return s.date===day()?s:blank()}}
function render(){s=read();$('num').textContent=$('called').textContent=fmt(s.current);$('ticket').textContent=fmt(s.issued+1);$('date').textContent=s.date;$('waiting').textContent='대기 인원 '+(s.issued-s.current)+'명'}
async function change(fn){const run=()=>{s=read();const result=fn(s);try{localStorage.setItem(K,JSON.stringify(s))}catch{}render();return result};return navigator.locks?navigator.locks.request(K,run):run()}
function sound(paper=false){try{let a=new AudioContext(),g=a.createGain();g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);let o;if(paper){let b=a.createBuffer(1,Math.floor(a.sampleRate*.16),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;o=a.createBufferSource();o.buffer=b}else{o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(160,a.currentTime);o.frequency.exponentialRampToValueAtTime(45,a.currentTime+.15)}o.connect(g);o.start();o.stop(a.currentTime+.16);o.onended=()=>a.close()}catch{}}
function show(){let admin=location.hash==='#admin';if(!admin)unlocked=false;$('user').hidden=admin;$('login').hidden=!admin||unlocked;$('admin').hidden=!admin||!unlocked;$('msg').textContent='';render()}
function key(k){if($('login').hidden)return;if(k==='CLEAR')pin='';else if(k==='BACK')pin=pin.slice(0,-1);else if(k==='↵'){if(pin==='6680'){unlocked=true;show()}else $('error').textContent='비밀번호가 일치하지 않습니다.';pin=''}else if(pin.length<4){pin+=k;$('error').textContent=''}$('pin').textContent='●'.repeat(pin.length)+'-'.repeat(4-pin.length)}
for(let k of ['1','2','3','4','5','6','7','8','9','CLEAR','0','↵']){let b=document.createElement('button');b.textContent=k;b.onclick=()=>key(k);$('keys').append(b)}
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Enter'&&!$('login').hidden){e.preventDefault();key('↵')}else if(e.key==='Backspace')key('BACK')});
let p=$('paper');async function issue(){if(busy)return;busy=true;try{let n=await change(x=>++x.issued);$('ticket').textContent=fmt(n);sound(true);$('msg').textContent=fmt(n)+'번 번호표가 발급되었습니다!';p.style.transition='transform .25s,opacity .25s';p.style.transform='translateY(150px) rotate(8deg)';p.style.opacity='0';await new Promise(r=>setTimeout(r,300));render();p.style.transform='none';p.style.opacity='1'}finally{busy=false}}
p.onpointerdown=e=>{if(busy)return;start=e.clientY;dist=0;p.setPointerCapture(e.pointerId);p.style.transition='none'};p.onpointermove=e=>{if(start===null)return;dist=Math.max(0,Math.min(140,e.clientY-start));p.style.transform='translateY('+dist+'px) rotate('+dist/80+'deg)'};p.onpointerup=()=>{if(start===null)return;start=null;if(dist>=55)issue();else p.style.transform='none'};p.onpointercancel=()=>{start=null;p.style.transform='none'};p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();issue()}};
function slam(){const b=$('next'),m=b.closest('.machine'),screen=m.querySelector('.screen');for(const [el,c] of [[b,'slam'],[m,'impact'],[screen,'flash']]){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}try{navigator.vibrate?.(35)}catch{}try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(34,t+.16);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.25);const n=a.createBuffer(1,Math.floor(a.sampleRate*.12),a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.018));const src=a.createBufferSource(),f=a.createBiquadFilter(),ng=a.createGain();src.buffer=n;f.type='lowpass';f.frequency.value=1900;ng.gain.value=.42;src.connect(f);f.connect(ng);ng.connect(a.destination);src.start(t);o.onended=()=>a.close()}catch{}}
$('next').onclick=async()=>{if(!unlocked||Date.now()-last<400)return;last=Date.now();slam();let n=await change(x=>x.current<x.issued?++x.current:null);$('msg').textContent=n===null?'대기 중인 고객이 없습니다.':fmt(n)+'번 고객님, 창구로 와주세요!';$('called').animate([{opacity:.2},{opacity:1}],{duration:250})};$('reset').onclick=()=>{if(unlocked&&confirm('번호를 초기화할까요?'))change(x=>{x.issued=0;x.current=0})};$('lock').onclick=()=>{unlocked=false;pin='';$('pin').textContent='----';show()};window.onhashchange=show;window.addEventListener('storage',render);setInterval(render,15000);show();
</script></html>
